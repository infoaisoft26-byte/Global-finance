<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>GLOBAL FINANCE — USDT Nile Test Deposit</title><style>*{box-sizing:border-box}body{margin:0;background:#070b19;color:#e5eefc;font-family:Arial,sans-serif;min-height:100vh;padding:24px}.wrap{max-width:760px;margin:0 auto}.card{background:#091129;border:1px solid #1d4ed866;border-radius:18px;padding:20px;margin-bottom:16px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#f59e0b22;border:1px solid #f59e0b66;color:#fbbf24;font-size:12px;font-weight:700}.input,.value{width:100%;padding:12px;border-radius:12px;border:1px solid #2563eb66;background:#050a18;color:white;font-family:monospace}.btn{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:linear-gradient(90deg,#2563eb,#06b6d4);color:white}.btn.secondary{background:#101936;border:1px solid #2563eb66}.status{margin-top:14px;padding:12px;border-radius:12px;background:#0b1535;border:1px solid #334155;color:#cbd5e1}.ok{border-color:#10b98188;color:#6ee7b7}.err{border-color:#ef444488;color:#fca5a5}.warn{border-color:#f59e0b88;color:#fde68a}.amount{font-size:28px;font-weight:800;color:#67e8f9;font-family:monospace}.address{word-break:break-all}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}</style></head><body><div class="wrap"><div class="card"><span class="badge">NILE TESTNET — NO REAL MONEY</span><h1>USDT Test Deposit</h1><p>Create a test deposit intent, then send the exact displayed test USDT amount to the shown Nile address.</p></div><div class="card"><input id="amountInr" class="input" type="number" min="100" max="500000" value="1000"/><div class="row"><button id="createBtn" class="btn">Create Nile Deposit</button></div><div id="message" class="status warn">Create a test deposit intent first.</div></div><div id="intentCard" class="card" style="display:none"><div id="usdtAmount" class="amount">—</div><div id="depositAddress" class="value address">—</div><div class="row"><button id="copyAmount" class="btn secondary">Copy Amount</button><button id="copyAddress" class="btn secondary">Copy Address</button><button id="checkBtn" class="btn">Check Confirmation</button></div><div id="intentStatus" class="status warn">Waiting for a confirmed Nile TRC20 transfer…</div></div></div><script>(()=>{const $=id=>document.getElementById(id);let activeIntent=null,pollTimer=null;const set=(id,text,type='warn')=>{const e=$(id);e.textContent=text;e.className='status '+type};async function api(path,options={}){const res=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.error||('Request failed: '+res.status));return body}function render(intent){activeIntent=intent;$('intentCard').style.display='block';$('usdtAmount').textContent=Number(intent.expectedAmountUsdt).toFixed(6)+' USDT-TEST';$('depositAddress').textContent=intent.depositAddress;set('intentStatus','Waiting for Nile confirmation. Expires '+new Date(intent.expiresAt).toLocaleString()+'.');if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(check,10000)}async function create(){try{const data=await api('/api/crypto-deposit-intent',{method:'POST',body:JSON.stringify({amountInr:Number($('amountInr').value)})});render(data.intent);set('message','Nile test deposit intent ready.','ok')}catch(e){set('message',e.message,'err')}}async function check(){if(!activeIntent)return;try{const data=await api('/api/crypto-deposit-sync',{method:'POST',body:'{}'});if(data.credited){clearInterval(pollTimer);set('intentStatus','Confirmed and credited. Fund Wallet: ₹'+Number(data.fundWallet||0).toLocaleString('en-IN')+' | TXID: '+data.txid,'ok')}else set('intentStatus',data.message||'Waiting…')}catch(e){set('intentStatus',e.message,'err')}}$('createBtn').onclick=create;$('checkBtn').onclick=check;$('copyAmount').onclick=()=>activeIntent&&navigator.clipboard.writeText(Number(activeIntent.expectedAmountUsdt).toFixed(6));$('copyAddress').onclick=()=>activeIntent&&navigator.clipboard.writeText(activeIntent.depositAddress)})();</script></body></html>

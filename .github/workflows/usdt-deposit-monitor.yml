name: Automatic USDT Deposit Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-usdt-deposits:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Scan confirmed BSC USDT deposits
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository secret: CRON_SECRET"
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 \
            --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            https://globalfinance1.online/api/usdt-auto-credit-cron

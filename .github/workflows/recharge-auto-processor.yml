name: Recharge Auto-Processor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: recharge-auto-processor
  cancel-in-progress: false

jobs:
  process-pending-recharges:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger secure recharge scanner
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repository secret CRON_SECRET is missing."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://globalfinance1.online/api/usdt-auto-credit-cron?depositsOnly=1"
